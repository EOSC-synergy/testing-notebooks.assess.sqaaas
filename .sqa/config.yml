        - /usr/bin/env sh .sqa/script.persimmon_diplomatic_boa.sh
        container: qc.sec_sapphire_tough_baboon
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.maroon_reliable_spren.sh
        container: qc.sty_crimson_reflective_turkey
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.amethyst_flexible_tarantula.sh
        container: qc.sty_purple_inventive_dingo
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.dawn_serene_shark.sh
        container: qc.uni_fandango_joyful_capybara
