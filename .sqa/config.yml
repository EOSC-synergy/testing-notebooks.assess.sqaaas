        - /usr/bin/env sh .sqa/script.butterscotch_anxious_goat.sh
        container: qc.doc_mango_mature_boar
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.royal_inspired_walrus.sh
        container: qc.doc_wisteria_logical_goose
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_witty_quokka.sh
        container: qc.doc_flint_fierce_mongoose
