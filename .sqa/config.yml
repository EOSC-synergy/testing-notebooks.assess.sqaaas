config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-lemon-discus.sh
        container: qc.acc_greasy-chocolate-wolf
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-cinnabar-chicken.sh
        container: qc.doc_ugly-purple-wolverine
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-gamboge-shrew.sh
        container: qc.doc_skinny-indigo-squirt
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.beady-tangerine-antelope.sh
        container: qc.doc_flabby-ruby-coyote
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-amethyst-ostrich.sh
        container: qc.lic_seedy-grey-corgi
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-purple-mastiff.sh
        container: qc.sec_pokey-malachite-panda
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.surly-xanthic-hornet.sh
        container: qc.sty_stuffy-heliotrope-frise
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-cinnabar-starfish.sh
        container: qc.sty_craggy-wisteria-wombat
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-charcoal-gerbil.sh
        container: qc.uni_smelly-burgundy-sponge
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-amaranth-gopher.sh
        container: qc.ver_gamy-malachite-greyhound
timeout: 5400
