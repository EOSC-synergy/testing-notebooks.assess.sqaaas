config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.steel_bright_panther.sh
        container: qc.acc_cadet_sociable_meerkat
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cobalt_reliable_griffin.sh
        container: qc.doc_aqua_rugged_cheetah
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.orange_peaceful_chameleon.sh
        container: qc.doc_salmon_perceptive_pelican
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_productive_cheetah.sh
        container: qc.doc_burgundy_restless_crocodile
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.coffee_candid_opossum.sh
        container: qc.lic_chartreuse_adventurous_sparrow
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.hunter_artistic_ocelot.sh
        container: qc.sec_hunter_daring_hummingbird
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.polar_diplomatic_gull.sh
        container: qc.sty_cayenne_reflective_gull
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.plum_jubilant_spren.sh
        container: qc.sty_coral_tenacious_impala
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.verdant_nurturing_sphinx.sh
        container: qc.uni_flax_loyal_chinchilla
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.azure_gentle_sparrow.sh
        container: qc.ver_grape_bold_marmoset
timeout: 5400
