      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_alert_iguana.sh
        container: qc.sty_forest_motivated_orangutan
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_shrewd_chameleon.sh
        container: qc.sty_echelon_energetic_butterfly
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.alabaster_open_dormouse.sh
        container: qc.uni_dawn_tactful_moose
