config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_positive_moose.sh
        container: qc.acc_frost_quirky_condor
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_feisty_piranha.sh
        container: qc.doc_sepia_delighted_roc
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.raven_mindful_stork.sh
        container: qc.doc_apricot_rustic_quoll
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.periwinkle_resourceful_flounder.sh
        container: qc.doc_ginger_clever_octopus
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_loyal_sphinx.sh
        container: qc.lic_smoke_zealous_nymph
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.jade_feisty_gibbon.sh
        container: qc.sec_jade_wise_puffin
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.wheat_driven_sloth.sh
        container: qc.sty_dahlia_joyful_penguin
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.gamboge_exuberant_caribou.sh
        container: qc.sty_hunter_brilliant_crow
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_whimsical_catfish.sh
        container: qc.uni_chartreuse_supportive_nighthawk
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.carmine_thoughtful_meerkat.sh
        container: qc.ver_smoke_industrious_cormorant
timeout: 5400
