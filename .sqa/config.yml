        - /usr/bin/env sh .sqa/script.cream_quirky_wolverine.sh
        container: qc.sty_eggplant_brave_gorilla
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.cosmos_brilliant_manta.sh
        container: qc.sty_ebony_responsible_peacock
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.kiwi_determined_sparrow.sh
        container: qc.uni_aquamarine_dizzy_kookaburra
