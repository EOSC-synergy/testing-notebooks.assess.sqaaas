        - /usr/bin/env sh .sqa/script.ginger_stoic_jaguar.sh
        container: qc.sty_mango_mindful_rabbit
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.incarnadine_motivated_uakari.sh
        container: qc.sty_chestnut_mysterious_uakari
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.crimson_dedicated_rhinoceros.sh
        container: qc.uni_mustard_shy_capybara
