      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.silver_joyful_badger.sh
        container: qc.sty_steel_upbeat_chameleon
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.carmine_dramatic_shark.sh
        container: qc.sty_ice_relaxed_cobra
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.iris_articulate_beaver.sh
        container: qc.uni_ceru_bold_catfish
