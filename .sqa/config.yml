config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_jubilant_starfish.sh
        container: qc.acc_aquamarine_timid_falcon
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cream_savvy_horse.sh
        container: qc.doc_olive_attentive_fox
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.aqua_bright_caribou.sh
        container: qc.doc_mint_driven_impala
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.umber_meticulous_opossum.sh
        container: qc.doc_carmine_resourceful_crane
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.powder_diplomatic_sloth.sh
        container: qc.lic_carmine_elated_ferret
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_fierce_coyote.sh
        container: qc.sec_boysenberry_shy_ibex
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.pink_nervous_raccoon.sh
        container: qc.sty_sand_happy_rabbit
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_curious_sphinx.sh
        container: qc.sty_cherry_apathetic_spren
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.teal_empathetic_bison.sh
        container: qc.uni_mauve_frugal_rabbit
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.champagne_industrious_moose.sh
        container: qc.ver_pistachio_helpful_grizzly
timeout: 5400
