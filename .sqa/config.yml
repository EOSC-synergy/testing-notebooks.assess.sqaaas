config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-plum-buffalo.sh
        container: qc.acc_tacky-aqua-goat
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-russet-eel.sh
        container: qc.doc_boozy-chocolate-sheepdog
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-brown-frise.sh
        container: qc.doc_shaky-vermilion-hound
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-magenta-sponge.sh
        container: qc.doc_scummy-seashell-gerbil
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-taupe-earwig.sh
        container: qc.lic_nerdy-wheat-hyrax
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-denim-ragdoll.sh
        container: qc.sec_snippy-mauve-budgerigar
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.leaky-lavender-kakapo.sh
        container: qc.sty_cloudy-jade-bandicoot
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-gamboge-audemer.sh
        container: qc.sty_smelly-white-chin
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-ecru-kudu.sh
        container: qc.uni_queasy-lavender-chamois
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-pumpkin-argentino.sh
        container: qc.ver_sloppy-bronze-chimpanzee
timeout: 5400
