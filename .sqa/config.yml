config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.lime_candid_tortoise.sh
        container: qc.acc_puce_unique_shark
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_visionary_hare.sh
        container: qc.doc_grape_diligent_kirin
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.kiwi_friendly_warthog.sh
        container: qc.doc_smoke_unique_thrush
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gamboge_radiant_lobster.sh
        container: qc.doc_taupe_perceptive_panther
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gray_rational_eagle.sh
        container: qc.lic_sage_lively_squirrel
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.butterscotch_empathetic_stingray.sh
        container: qc.sec_lilac_logical_toad
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lime_responsible_capybara.sh
        container: qc.sty_hunter_melancholy_hornbill
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.beige_sweet_macaw.sh
        container: qc.sty_cinnabar_spirited_wolf
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.frost_candid_donkey.sh
        container: qc.uni_mustard_perky_giraffe
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.pearl_fair_manatee.sh
        container: qc.ver_coral_respectful_sparrow
timeout: 5400
