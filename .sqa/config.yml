config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-rose-cuttlefish.sh
        container: qc.acc_pasty-heliotrope-mayfly
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-rust-husky.sh
        container: qc.doc_squirrely-thistle-akbash
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-smalt-dachsbracke.sh
        container: qc.doc_paltry-vermilion-albatross
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-taupe-budgerigar.sh
        container: qc.doc_dorky-myrtle-dane
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.bluesy-asparagus-wrasse.sh
        container: qc.lic_cloudy-malachite-chinchilla
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-zucchini-buzzard.sh
        container: qc.sec_muzzy-amaranth-squirt
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-grey-gerbil.sh
        container: qc.sty_wiggy-persimmon-uakari
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-olive-koala.sh
        container: qc.sty_blurry-taupe-cheetah
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-smalt-sheepdog.sh
        container: qc.uni_foggy-emerald-chihuahua
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-olivine-chihuahua.sh
        container: qc.ver_flaky-persimmon-frise
timeout: 5400
