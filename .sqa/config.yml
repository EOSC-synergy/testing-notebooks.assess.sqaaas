config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.flax_tough_macaw.sh
        container: qc.acc_thistle_mindful_turkey
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lemon_restless_salamander.sh
        container: qc.doc_harlequin_productive_wasp
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.amethyst_bewildered_quokka.sh
        container: qc.doc_fandango_peppy_groundhog
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_daring_panda.sh
        container: qc.doc_ultramarine_authentic_tapir
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_brilliant_caribou.sh
        container: qc.lic_yellow_whimsical_jaguar
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cherry_happy_owl.sh
        container: qc.sec_strawberry_honest_bullfrog
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.scarlet_playful_hamster.sh
        container: qc.sty_mulberry_fair_griffin
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.aquamarine_motivated_bullfrog.sh
        container: qc.sty_sunset_open_toucan
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.iris_focused_opossum.sh
        container: qc.uni_bronze_sweet_owl
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_foolish_ibex.sh
        container: qc.ver_sepia_bold_mandrill
timeout: 5400
