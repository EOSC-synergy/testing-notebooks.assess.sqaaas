        - /usr/bin/env sh .sqa/script.glaucous_industrious_meerkat.sh
        container: qc.sty_jasmine_whimsical_gerbil
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.chocolate_feisty_sparrow.sh
        container: qc.sty_marigold_proactive_dragon
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_reliable_falcon.sh
        container: qc.uni_cornflower_reflective_hedgehog
