      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.linen_alert_alligator.sh
        container: qc.sec_coffee_vibrant_gull
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_cheerful_hyena.sh
        container: qc.sty_turmeric_stubborn_llama
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_playful_leopard.sh
        container: qc.sty_lavender_witty_spren
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.indigo_lucky_leopard.sh
        container: qc.uni_hunter_sociable_finch
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_aware_hamster.sh
        container: qc.ver_ivory_pensive_shark
