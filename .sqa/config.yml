config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.iris_responsible_skunk.sh
        container: qc.acc_cosmos_cautious_hawk
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.smoke_peaceful_rhinoceros.sh
        container: qc.doc_emerald_bright_moth
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.wine_energetic_stork.sh
        container: qc.doc_watermelon_happy_roadrunner
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.frost_thankful_puffin.sh
        container: qc.doc_scarlet_fearless_flamingo
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_insightful_stingray.sh
        container: qc.lic_moss_understanding_baboon
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.coffee_productive_porpoise.sh
        container: qc.sec_carmine_positive_baboon
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.frost_realistic_platypus.sh
        container: qc.sty_amethyst_easygoing_chameleon
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.viridian_generous_antelope.sh
        container: qc.sty_flint_rational_groundhog
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.khaki_graceful_tiger.sh
        container: qc.uni_frost_peppy_baboon
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cardamom_foolish_toucan.sh
        container: qc.ver_aquamarine_kind_condor
