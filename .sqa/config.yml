config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.seafoam_reckless_platypus.sh
        container: qc.acc_burgundy_optimistic_llama
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.fandango_hopeful_walrus.sh
        container: qc.doc_khaki_imaginative_walrus
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.pearl_perky_hawk.sh
        container: qc.doc_fern_creative_goat
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.tundra_perceptive_gull.sh
        container: qc.doc_khaki_shrewd_stingray
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flint_adaptable_chipmunk.sh
        container: qc.lic_dahlia_eager_hummingbird
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cerulean_confident_barracuda.sh
        container: qc.sec_glaucous_compassionate_reindeer
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.flint_shrewd_ibis.sh
        container: qc.sty_thistle_quirky_dragonfly
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.ebony_timid_termite.sh
        container: qc.sty_hunter_outgoing_phoenix
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_philosophical_gorilla.sh
        container: qc.uni_yellow_mysterious_otter
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.flint_inventive_boar.sh
        container: qc.ver_ash_nervous_kiwi
timeout: 5400
