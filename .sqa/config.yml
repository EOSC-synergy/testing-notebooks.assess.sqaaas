        - /usr/bin/env sh .sqa/script.bronze_reflective_boar.sh
        container: qc.doc_sand_amiable_owl
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_sympathetic_lynx.sh
        container: qc.doc_tundra_dreamy_mongoose
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.puce_witty_hyena.sh
        container: qc.doc_seafoam_anxious_capybara
  QC.Lic:
