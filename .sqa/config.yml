        - /usr/bin/env sh .sqa/script.chestnut_ardent_starfish.sh
        container: qc.doc_malachite_cranky_kiwi
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.periwinkle_affectionate_mongoose.sh
        container: qc.doc_emerald_mischievous_donkey
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.jet_energetic_mongoose.sh
        container: qc.doc_polar_imaginative_squirrel
