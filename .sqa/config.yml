      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.sepia_industrious_owl.sh
        container: qc.sec_lavender_compassionate_alpaca
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.sand_helpful_goose.sh
        container: qc.sty_maroon_zealous_vulture
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.linen_zany_moth.sh
        container: qc.sty_mint_open_roadrunner
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.apricot_rustic_rabbit.sh
        container: qc.uni_green_energetic_turkey
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
