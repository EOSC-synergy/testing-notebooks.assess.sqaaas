config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/testing-notebooks:
      branch: main
      repo: https://github.com/PalomoIFCA/testing-notebooks
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-heliotrope-grasshopper.sh
        container: qc.acc_lanky-turquoise-dormouse
  QC.Doc:
    repos:
      github.com/PalomoIFCA/testing-notebooks find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-xanthic-eagle.sh
        container: qc.doc_skinny-copper-fowl
      github.com/PalomoIFCA/testing-notebooks git:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-bistre-tetra.sh
        container: qc.doc_chewy-crimson-dogfish
      github.com/PalomoIFCA/testing-notebooks markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.beady-gold-beagle.sh
        container: qc.doc_sunny-gamboge-spoonbill
  QC.Lic:
    repos:
      github.com/PalomoIFCA/testing-notebooks licensee:
        commands:
        - /usr/bin/env sh .sqa/script.messy-wheat-dachsbracke.sh
        container: qc.lic_lovely-magenta-elephant
  QC.Sec:
    repos:
      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-champagne-dane.sh
        container: qc.sec_ugly-cardinal-fox
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-corn-jaguar.sh
        container: qc.sty_sloppy-vermilion-hornet
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.homey-denim-ant.sh
        container: qc.sty_ugly-chartreuse-macaque
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-seashell-eleuth.sh
        container: qc.uni_leaky-lime-dodo
  QC.Ver:
    repos:
      github.com/PalomoIFCA/testing-notebooks get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-turquoise-macaw.sh
        container: qc.ver_crabby-carmine-dog
timeout: 5400
