      github.com/PalomoIFCA/testing-notebooks bandit:
        commands:
        - /usr/bin/env sh .sqa/script.sage_nervous_roadrunner.sh
        container: qc.sec_gunmetal_fearless_phoenix
  QC.Sty:
    repos:
      github.com/PalomoIFCA/testing-notebooks flake8:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_serene_hummingbird.sh
        container: qc.sty_navy_rugged_ibis
      github.com/PalomoIFCA/testing-notebooks pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.butter_cheerful_raccoon.sh
        container: qc.sty_incarnadine_organized_stork
  QC.Uni:
    repos:
      github.com/PalomoIFCA/testing-notebooks pytest:
        commands:
        - /usr/bin/env sh .sqa/script.orchid_stubborn_salamander.sh
        container: qc.uni_watermelon_studious_pelican
